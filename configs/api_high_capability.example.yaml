llm:
  backend: openai_compatible
  base_url: ${LLM_BASE_URL}
  api_key_env: LLM_API_KEY
  model: ${LLM_MODEL}

vlm:
  backend: openai_compatible
  base_url: ${VLM_BASE_URL}
  api_key_env: VLM_API_KEY
  model: ${VLM_MODEL}

generation:
  temperature: 0.0
  max_output_tokens: 2400
  timeout_seconds: 120
  max_retries: 3
  repair_retries: 1

budget:
  max_frames: 96
  max_estimated_visual_tokens: 49152
  max_visual_calls: 16
  min_warm_frames_per_video: 6
  scan_frames_per_video: 10
  default_focus_frames: 12
  max_comparisons_per_round: 8
  max_comparison_rounds: 3
  estimated_tokens_per_frame: 384

video:
  cache_dir: .unicvr_cache/frames
  resize_long_edge: 1024
  jpeg_quality: 90
  candidate_multiplier: 4
  coverage_weight: 1.0
  change_weight: 0.4
  question_weight: 0.15
  redundancy_weight: 0.25
  pre_context_ratio: 0.3
  post_context_ratio: 0.3

trace:
  output_dir: outputs
  record_raw_responses: true
  max_raw_response_chars: 12000
